version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: musicapp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Saurabh@9087
      POSTGRES_DB: musicapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - musicnet

  minio:
    image: minio/minio:latest
    container_name: musicapp-minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    networks:
      - musicnet

  pgadmin:
    image: dpage/pgadmin4
    container_name: musicapp-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - musicnet

  web:
    build: .
    container_name: musicapp-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:Saurabh@9087@db:5432/musicapp
      - BETTER_AUTH_SECRET=changeme_in_production
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_URL=http://localhost:3000

      # MinIO / Storage
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=music-covers
      - MINIO_USE_SSL=false
    depends_on:
      - db
      - minio
    networks:
      - musicnet

networks:
  musicnet:
    driver: bridge

volumes:
  db_data:
  minio_data:
